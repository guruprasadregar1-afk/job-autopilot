# Approved Answers to Recurring Screening Questions - Example Configuration Template
# Fill in with your approved answers and placeholders before running the automation.

answers:
  # Notice Period
  - patterns:
      - "notice period"
      - "how soon can you join"
      - "availability"
      - "joining time"
    value: "60 days"
    numeric_value: 60

  # Experience
  - patterns:
      - "total years of experience"
      - "total years of professional experience"
      - "overall experience"
      - "total experience"
      - "total professional experience"
      - "overall years of experience"
      - "total work experience"
    value: "4.5"
    numeric_value: 4.5

  # Compensation
  - patterns:
      - "current ctc"
      - "current salary"
      - "current annual compensation"
    value: "YOUR_CTC"
    numeric_value: YOUR_CTC

  - patterns:
      - "expected ctc"
      - "expected salary"
      - "salary expectation"
    value: "YOUR_EXPECTED_CTC"
    numeric_value: YOUR_EXPECTED_CTC

  # Location & Postal Code
  - patterns:
      - "postal code"
      - "zip code"
      - "pincode"
      - "pin code"
    value: "YOUR_PIN"
    numeric_value: YOUR_PIN

  # Hybrid Model
  - patterns:
      - "Are you comfortable working with a hybrid model?"
      - "comfortable working with a hybrid model"
      - "comfortable working in hybrid"
      - "comfortable working in a hybrid model"
    value: "Yes"
    textarea_value: "Yes, I am comfortable working in a hybrid model and collaborating with the team both remotely and in person."
    exact_match: true

  # Teamwork
  - patterns:
      - "Are you comfortable working in a team?"
      - "comfortable working in a team"
      - "comfortable working with a team"
      - "are you comfortable working with a team"
    value: "Yes"
    textarea_value: "Yes, I am comfortable collaborating with developers and other stakeholders, discussing technical requirements, and working together to deliver application features."
    exact_match: true

  # Technical Proficiency & Familiarity Questions
  - patterns:
      - "are you proficient in javascript"
    value: "Yes"
    textarea_value: "Yes, I have professional experience developing applications using JavaScript, including backend services and frontend functionality."
    exact_match: true

  - patterns:
      - "are you proficient in typescript"
    value: "Yes"
    textarea_value: "Yes, I have experience using TypeScript to develop and maintain application code."
    exact_match: true

  - patterns:
      - "are you experienced with nodejs"
      - "are you experienced with node.js"
    value: "Yes"
    textarea_value: "Yes, I have experience developing backend services and APIs using Node.js."
    exact_match: true

  - patterns:
      - "are you familiar with expressjs"
      - "are you familiar with express.js"
    value: "Yes"
    textarea_value: "Yes, I have experience working with Express.js for backend API development."
    exact_match: true

  - patterns:
      - "are you familiar with react"
      - "are you familiar with reactjs"
    value: "Yes"
    textarea_value: "Yes, I have experience developing frontend interfaces and integrating APIs using React."
    exact_match: true

  - patterns:
      - "are you familiar with nextjs"
      - "are you familiar with next.js"
    value: "Yes"
    textarea_value: "Yes, I have experience working with Next.js applications, including frontend development, routing, responsive layouts, and API integration."
    exact_match: true

  - patterns:
      - "are you experienced with mongodb"
    value: "Yes"
    textarea_value: "I have worked with MongoDB as part of full-stack application development."
    exact_match: true

  # Work Authorization in India
  - patterns:
      - "are you legally authorized to work in india"
      - "are you authorized to work in india"
    value: "Yes"
    exact_match: true

  # Visa Sponsorship
  - patterns:
      - "do you require visa sponsorship"
      - "will you require visa sponsorship"
      - "do you require sponsorship"
    value: "No"
    exact_match: true

  # Remote / Onsite
  - patterns:
      - "are you comfortable working remotely"
      - "are you comfortable working on-site"
      - "are you comfortable working onsite"
      - "comfortable working remotely"
      - "comfortable working on-site"
      - "comfortable working onsite"
    value: "Yes"
    exact_match: true

  # Relocation
  - patterns:
      - "are you willing to relocate"
      - "are you open to relocation"
      - "willing to relocate"
    value: "Yes"
    exact_match: true

