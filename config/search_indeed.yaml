# Indeed Search Configurations
platform: "indeed"

searches:
  - keywords: "Senior Full Stack Developer"
    location: "India"
    iafilter: true              # "Easily apply" jobs only
    domain: "in.indeed.com"

  - keywords: "Senior Full Stack Developer"
    location: "Dubai"
    iafilter: true              # "Easily apply" jobs only
    domain: "ae.indeed.com"

  - keywords: "Full Stack Engineer"
    location: "India"
    iafilter: true
    domain: "in.indeed.com"

  - keywords: "Full Stack Developer"
    location: "United Arab Emirates"
    iafilter: true
    domain: "ae.indeed.com"

  - keywords: "MERN Stack Developer"
    location: "India"
    iafilter: true
    domain: "in.indeed.com"
